# Supabase pauses free projects after 7 days with little activity.
# This makes one small database request every day so the live site stays up.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 * * *" # every day at 14:17 UTC
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Make one small database request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/companies?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase answered with HTTP $status"
          # 200 = answered; 401/403 = answered but refused (row-level security). Both reach the database.
          case "$status" in
            2*|401|403) echo "OK" ;;
            *) echo "Supabase did not answer properly"; exit 1 ;;
          esac
